<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Антисептики</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            padding: 20px;
        }
        .products-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)) !important;
            gap: 16px !important;
        }
        .product-card {
            background: #ffffff !important;
            border-radius: 12px !important;
            padding: 16px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08) !important;
            border: 1px solid #e9ecef !important;
            transition: transform 0.2s ease, box-shadow 0.2s ease !important;
        }
        .product-card:hover {
            transform: translateY(-3px) !important;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1) !important;
        }
        .product-brand {
            font-size: 13px !important;
            color: #6c757d !important;
            font-weight: 600 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.3px !important;
        }
        .product-name {
            font-size: 15px !important;
            font-weight: 700 !important;
            margin: 6px 0 !important;
            color: #1a2a3a !important;
            line-height: 1.3 !important;
        }
        .product-price {
            font-size: 20px !important;
            font-weight: 700 !important;
            color: #1a2a3a !important;
            margin: 8px 0 4px !important;
        }
        .product-volume {
            font-size: 13px !important;
            color: #868e96 !important;
        }
        .product-stock {
            display: inline-block !important;
            padding: 3px 12px !important;
            border-radius: 20px !important;
            font-size: 12px !important;
            font-weight: 500 !important;
            margin-top: 8px !important;
        }
        .in-stock {
            color: #2b8a3e !important;
            background: #e6f7ed !important;
        }
        .on-order {
            color: #e67700 !important;
            background: #fff3e0 !important;
        }
        .loading {
            text-align: center !important;
            padding: 40px !important;
            color: #868e96 !important;
        }
        .error {
            text-align: center !important;
            padding: 40px !important;
            color: #e74c3c !important;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">⏳ Загрузка товаров...</div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('app');
            const category = 'antiseptiki';
            const PRODUCTS_URL = 'https://raw.githubusercontent.com/gerasimov197789-gif/colormsk-products/main/products/';

            async function loadProducts() {
                try {
                    const response = await fetch(PRODUCTS_URL + category + '.json');
                    if (!response.ok) throw new Error('Ошибка загрузки данных (статус ' + response.status + ')');
                    const items = await response.json();

                    if (!items || items.length === 0) {
                        container.innerHTML = '<div class="error">Товары не найдены</div>';
                        return;
                    }

                    let html = '<div class="products-grid">';
                    items.forEach(product => {
                        const firstSize = product.sizes[0];
                        const firstOption = firstSize.options[0];
                        const stockClass = firstOption.stock === 'Под заказ' ? 'on-order' : 'in-stock';
                        const stockText = firstOption.stock === 'Под заказ' ? '⏳ Под заказ' : '✅ В наличии';

                        html += `
                            <div class="product-card">
                                <div class="product-brand">${product.brand}</div>
                                <div class="product-name">${product.name}</div>
                                <div class="product-price">${firstOption.price.toLocaleString()} ₽</div>
                                <div class="product-volume">${firstSize.volume}</div>
                                <div class="product-stock ${stockClass}">${stockText}</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    container.innerHTML = html;

                } catch (error) {
                    container.innerHTML = `<div class="error">❌ Ошибка: ${error.message}</div>`;
                }
            }

            loadProducts();
        })();
    </script>
</body>
</html>
