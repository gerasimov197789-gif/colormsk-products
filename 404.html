<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
const path = window.location.pathname;
const page = path.split('/').filter(p => p.length > 0)[0];
if (page && page !== 'colormsk-products') {
    window.location.href = '/colormsk-products/?page=' + page;
} else {
    window.location.href = '/colormsk-products/';
}
</script>
</head>
<body>
</body>
</html>
