name: Generate Sitemap

on:
  push:
    branches: [ main ]
    paths:
      - 'products/*.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Generate sitemap
        run: |
          node generate-sitemap.js
      
      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "🔄 Автообновление sitemap" || echo "Нет изменений"
          git push
